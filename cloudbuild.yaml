steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/policy-wind-tunnel:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/policy-wind-tunnel:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - policy-wind-tunnel
      - --image=gcr.io/$PROJECT_ID/policy-wind-tunnel:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=2Gi
      - --cpu=2
      - --min-instances=1
      - --max-instances=5
      - --timeout=300
      - --set-secrets=GOOGLE_API_KEY=GOOGLE_API_KEY:latest
      - --set-env-vars=GOOGLE_GENAI_USE_VERTEXAI=true
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID
      - --set-env-vars=GOOGLE_CLOUD_LOCATION=global
      - --set-env-vars=PWT_MODEL=gemini-2.5-flash
      - --set-env-vars=PWT_LIVE_LEADERS=1
      - --service-account=policy-wind-tunnel-sa@$PROJECT_ID.iam.gserviceaccount.com

images:
  - gcr.io/$PROJECT_ID/policy-wind-tunnel:$COMMIT_SHA
