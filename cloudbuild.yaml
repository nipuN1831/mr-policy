steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/policy-wind-tunnel:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/policy-wind-tunnel:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - policy-wind-tunnel
      - --image=gcr.io/$PROJECT_ID/policy-wind-tunnel:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=1
      - --max-instances=5
      - --set-secrets=GOOGLE_API_KEY=GOOGLE_API_KEY:latest

images:
  - gcr.io/$PROJECT_ID/policy-wind-tunnel:$COMMIT_SHA
